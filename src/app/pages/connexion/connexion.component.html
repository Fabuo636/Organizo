<div class="connexion-container">
  <div class="logo-section">
    <div class="logo">
      <span class="check">✓</span>rganizo
    </div>
    <div class="background-dots">
      <div *ngFor="let dot of dots" 
           class="dot"
           [style.top]="dot.top"
           [style.left]="dot.left"
           [style.width]="dot.size"
           [style.height]="dot.size"
           [style.background-color]="dot.color"
           [@floatingDots]="dot.state">
      </div>
    </div>
  </div>

  <div class="form-container">
    <h1>Bienvenue</h1>
    <p class="subtitle">à nouveau</p>

    <form (ngSubmit)="onSubmit()" #connexionForm="ngForm">
      <div class="form-group">
        <span class="material-icons">phone</span>
        <input 
          type="tel" 
          [(ngModel)]="userData.telephone" 
          name="telephone" 
          placeholder="Téléphone"
          required>
      </div>

      <div class="form-group">
        <span class="material-icons">lock_outline</span>
        <input 
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="userData.motDePasse" 
          name="motDePasse"
          placeholder="Mot de passe" 
          required>
        <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
          <span class="material-icons">
            {{showPassword ? 'visibility_off' : 'visibility'}}
          </span>
        </button>
      </div>

      <div class="forgot-password">
        <a routerLink="/mot-de-passe-oublie">Mot de passe oublié</a>
      </div>

      <button type="submit" class="submit-btn">Connexion</button>
    </form>

    <div class="register-link">
      <span>Avez-vous un compte? </span>
      <a routerLink="/inscription">Inscription</a>
    </div>
  </div>
</div>
